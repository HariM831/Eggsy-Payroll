name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Every build must be signed with the SAME debug key, or Android refuses
      # to install a new APK over the previously installed one (signature
      # mismatch), forcing an uninstall that wipes on-device data. A fresh
      # runner has no keystore, so: reuse the one committed at
      # debug.keystore if present, otherwise generate it once and commit it
      # back so every future run (and any local build that copies the same
      # file, see README) signs identically.
      - name: Ensure fixed debug keystore
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore ]; then
            echo "Using committed debug.keystore"
            cp debug.keystore ~/.android/debug.keystore
          else
            echo "No debug.keystore committed yet — generating one"
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            cp debug.keystore ~/.android/debug.keystore
            echo "KEYSTORE_GENERATED=true" >> "$GITHUB_ENV"
          fi

      - name: Commit newly generated debug keystore
        if: env.KEYSTORE_GENERATED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add debug.keystore
          git commit -m "Add fixed debug keystore for consistent APK signing"
          git push

      # No package-lock.json is committed (this repo was scaffolded without a
      # Node environment available to generate one), so `npm ci` can't run —
      # it requires an existing lockfile. Once a lockfile is committed here,
      # switch this to `npm ci` for reproducible, faster installs.
      - name: Install dependencies
        run: npm install

      - name: Build web app (also copies face-recognition models into the bundle)
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Grant camera permission in the generated manifest
        run: node scripts/patch-android-manifest.mjs

      - name: Pin signing to the committed debug keystore
        run: node scripts/patch-android-signing.mjs

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: niko-payroll-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
